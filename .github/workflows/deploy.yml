name: Deploy to GitHub Pages

on:
  push:
    branches: ["master"] # Triggers the workflow when you push to the master branch
  workflow_dispatch:   # Allows you to run this workflow manually from the Actions tab

# Grants necessary permissions to deploy to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Prevents multiple deployments from running at the exact same time
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # Uploads the entire root directory. Change to './dist' if using a build tool.

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4